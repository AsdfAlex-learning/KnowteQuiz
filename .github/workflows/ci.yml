name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + type-check + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  backend:
    name: Backend (Rust test + check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo check (release)
        working-directory: src-tauri
        run: cargo check --release

  backend-windows:
    name: Backend (Rust test on Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # First runs on Windows are unverified; keep them advisory until green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  smoke-web:
    name: Smoke test (web mode)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build frontend
        run: npm run build

      - name: Build web server binary
        working-directory: src-tauri
        run: cargo build

      - name: Start web server & smoke test
        run: |
          cd src-tauri
          # Hermetic data dir: the smoke test must not touch real user data.
          rm -rf /tmp/kq-smoke-data && mkdir -p /tmp/kq-smoke-data

          # Startup time varies on CI runners; poll instead of guessing.
          wait_for_server() {
            for ((i=1; i<=60; i++)); do
              if curl -sSf "http://127.0.0.1:14201/api/data/status" > /dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Server did not become ready within 60s"
            return 1
          }

          set -e

          ./target/debug/knowtequiz --mode=web --port=14201 --data-dir=/tmp/kq-smoke-data &
          SERVER_PID=$!
          wait_for_server

          # 1. Server ready check
          curl -sSf http://127.0.0.1:14201/api/data/status > /dev/null

          # 2. Settings endpoint
          curl -sSf http://127.0.0.1:14201/api/settings > /dev/null

          # 3. Scan fixture notes
          FIXTURE_PATH="$(cd "$(pwd)/../fixture-notes" && pwd)"
          curl -sSf "http://127.0.0.1:14201/api/notes/scan?root_path=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$FIXTURE_PATH")" > /tmp/notes.json
          NOTE_COUNT=$(python3 -c 'import json,sys; print(sum(1 for n in json.load(sys.stdin) if not n.get("is_dir")))' < /tmp/notes.json)
          if [ "$NOTE_COUNT" -lt 1 ]; then echo "No markdown files found"; exit 1; fi
          echo "Smoke: scanned $NOTE_COUNT markdown files"

          # 3.5 Register the scanned directory as the configured note root.
          #     Reads are authorised against settings.workspace.root_path, and the
          #     web UI performs the same persist after scanning (explorer store),
          #     so an API-only client must do this before reading a note.
          curl -sSf http://127.0.0.1:14201/api/settings > /tmp/settings_root.json
          ROOT_PATH="$FIXTURE_PATH" python3 -c "
          import json, os
          s = json.load(open('/tmp/settings_root.json'))
          s['workspace']['root_path'] = os.environ['ROOT_PATH']
          json.dump(s, open('/tmp/settings_root.json', 'w'))
          "
          curl -sSf -X POST http://127.0.0.1:14201/api/settings \
            -H "Content-Type: application/json" \
            -d @/tmp/settings_root.json > /dev/null
          echo "Smoke: note root registered at $FIXTURE_PATH"

          # 4. Read a markdown note
          NOTE_PATH=$(python3 -c 'import json,sys,urllib.parse; notes=json.load(sys.stdin); leaf=[n for n in notes if not n.get("is_dir")][0]; print(urllib.parse.quote(leaf["path"],safe=""))' < /tmp/notes.json)
          curl -sSf "http://127.0.0.1:14201/api/notes/read?path=$NOTE_PATH" > /tmp/note.json
          echo "Smoke: read note"

          # 5. Save a mistake, then verify it persists
          MISTAKE_ID="smoke-$(date +%s)"
          curl -sSf -X POST http://127.0.0.1:14201/api/mistakes \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$MISTAKE_ID\",\"note_path\":\"/notes/smoke.md\",\"note_title\":\"Smoke\",\"question\":\"Q?\",\"user_answer\":\"A\",\"correct_answer\":\"B\",\"explanation\":\"smoke\",\"mode\":\"basic\",\"created_at\":\"2026-01-01T00:00:00.000Z\",\"review_count\":0}" > /dev/null

          curl -sSf http://127.0.0.1:14201/api/mistakes > /tmp/mistakes.json
          FOUND=$(python3 -c "import json,sys; data=json.load(sys.stdin); print(1 if any(m['id']=='$MISTAKE_ID' for m in data) else 0)" < /tmp/mistakes.json)
          if [ "$FOUND" != "1" ]; then echo "Mistake did not persist"; exit 1; fi
          echo "Smoke: mistake persisted"

          # 6. Settings persistence across restart
          #    Read settings, modify quiz.default_language, write back, restart, verify
          curl -sSf http://127.0.0.1:14201/api/settings > /tmp/settings_orig.json
          ORIGINAL_LANG=$(python3 -c "import json,sys; print(json.load(sys.stdin)['quiz']['default_language'])" < /tmp/settings_orig.json)
          python3 -c "
          import json,sys
          s=json.load(open('/tmp/settings_orig.json'))
          s['quiz']['default_language']='ja'
          json.dump(s,open('/tmp/settings_new.json','w'))
          "
          curl -sSf -X POST http://127.0.0.1:14201/api/settings \
            -H "Content-Type: application/json" \
            -d @/tmp/settings_new.json > /dev/null

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          sleep 1

          cargo run -- --mode=web --port=14201 --data-dir=/tmp/kq-smoke-data &
          SERVER_PID=$!
          wait_for_server

          curl -sSf http://127.0.0.1:14201/api/settings > /tmp/settings_after.json
          SAVED_LANG=$(python3 -c "import json,sys; print(json.load(sys.stdin)['quiz']['default_language'])" < /tmp/settings_after.json)
          if [ "$SAVED_LANG" != "ja" ]; then echo "Settings did not persist: expected ja, got $SAVED_LANG"; exit 1; fi
          echo "Smoke: settings persisted across restart"

          # Restore original settings
          curl -sSf -X POST http://127.0.0.1:14201/api/settings \
            -H "Content-Type: application/json" \
            -d @/tmp/settings_orig.json > /dev/null

          # 7. Mark mistake as reviewed
          curl -sSf -X POST http://127.0.0.1:14201/api/mistakes/review \
            -H "Content-Type: application/json" \
            -d "{\"mistake_id\":\"$MISTAKE_ID\",\"quality\":3}" > /dev/null
          echo "Smoke: mistake marked as reviewed"

          echo "Smoke test passed (7 steps)"
          kill $SERVER_PID
